server.port=${PORT:8080}
spring.application.name=JavaAppLogTesting

# Logging
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file — relative path anchors to the working directory at runtime.
# Override with an absolute path if needed, e.g. /var/log/myapp/app.log
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
info.app.name=JavaAppLogTesting
info.app.version=1.0.0
