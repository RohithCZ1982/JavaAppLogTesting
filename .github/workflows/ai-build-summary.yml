name: Java CI with AI Exception Summary

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read        # checkout
  pull-requests: write  # post PR comments
  models: read          # GitHub Models API (gpt-4o-mini)

jobs:
  build-and-analyze:
    name: Build, Test & AI Analysis
    runs-on: ubuntu-latest

    steps:

      # ─── 1. CHECKOUT ──────────────────────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── 2. AUTO-DETECT MAVEN OR GRADLE ──────────────────────────────────────
      - name: Detect build tool
        id: detect
        run: |
          if [ -f "mvnw" ]; then
            chmod +x mvnw
            echo "cmd=./mvnw" >> $GITHUB_OUTPUT
            echo "type=maven" >> $GITHUB_OUTPUT
            echo "Detected: Maven Wrapper (mvnw)"
          elif [ -f "pom.xml" ]; then
            echo "cmd=mvn" >> $GITHUB_OUTPUT
            echo "type=maven" >> $GITHUB_OUTPUT
            echo "Detected: Maven (system)"
          elif [ -f "gradlew" ]; then
            chmod +x gradlew
            echo "cmd=./gradlew" >> $GITHUB_OUTPUT
            echo "type=gradle" >> $GITHUB_OUTPUT
            echo "Detected: Gradle Wrapper (gradlew)"
          elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            echo "cmd=gradle" >> $GITHUB_OUTPUT
            echo "type=gradle" >> $GITHUB_OUTPUT
            echo "Detected: Gradle (system)"
          else
            echo "::error::No build tool found. Expected pom.xml, mvnw, build.gradle, or gradlew."
            exit 1
          fi

      # ─── 3. SETUP JDK 21 ──────────────────────────────────────────────────────
      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ─── 4. CACHE DEPENDENCIES ────────────────────────────────────────────────
      - name: Cache Maven repository
        if: steps.detect.outputs.type == 'maven'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Cache Gradle caches
        if: steps.detect.outputs.type == 'gradle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # ─── 5. BUILD AND TEST ────────────────────────────────────────────────────
      - name: Run build and tests
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          if [ "${{ steps.detect.outputs.type }}" == "maven" ]; then
            ${{ steps.detect.outputs.cmd }} clean verify -B --no-transfer-progress 2>&1 | tee build.log
          else
            ${{ steps.detect.outputs.cmd }} clean build test --no-daemon --console=plain 2>&1 | tee build.log
          fi

      # ─── 6. COLLECT LOGS ──────────────────────────────────────────────────────
      - name: Collect build and test logs
        if: always()
        run: |
          mkdir -p collected-logs
          find . -path "*/surefire-reports/*.txt" -exec cp {} collected-logs/ \; 2>/dev/null || true
          find . -path "*/surefire-reports/*.xml" -exec cp {} collected-logs/ \; 2>/dev/null || true
          find . -path "*/failsafe-reports/*.txt" -exec cp {} collected-logs/ \; 2>/dev/null || true
          find . -path "*/failsafe-reports/*.xml" -exec cp {} collected-logs/ \; 2>/dev/null || true
          find . -path "*/build/reports/tests/**/*.xml" -exec cp {} collected-logs/ \; 2>/dev/null || true
          find . -path "*/build/test-results/**/*.xml"  -exec cp {} collected-logs/ \; 2>/dev/null || true
          find . -name "*.log" \
            -not -path "*/.git/*" \
            -not -path "*/node_modules/*" \
            -not -path "*/collected-logs/*" \
            -exec cp {} collected-logs/ \; 2>/dev/null || true
          cp build.log collected-logs/ 2>/dev/null || true

          # Prefer the dedicated error log; fall back to all collected logs
          if [ -f "logs/error.log" ] && [ -s "logs/error.log" ]; then
            echo "Using logs/error.log as primary error source"
            cp logs/error.log collected-logs/error.log
            tail -c 8000 collected-logs/error.log > truncated-logs.txt
          else
            cat collected-logs/* 2>/dev/null | tail -c 8000 > truncated-logs.txt || touch truncated-logs.txt
          fi
          echo "Collected $(ls collected-logs | wc -l) log file(s), $(wc -c < truncated-logs.txt) bytes."

      # ─── 7. UPLOAD ARTIFACTS ──────────────────────────────────────────────────
      - name: Upload logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: collected-logs/
          retention-days: 7

      # ─── 8. AI EXCEPTION SUMMARY ──────────────────────────────────────────────
      # Uses shell: python3 {0} — GitHub Actions writes the run: block to a
      # temp .py file and executes it. No heredoc needed, no YAML conflicts.
      - name: Generate AI exception summary
        id: ai_summary
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_TOOL: ${{ steps.detect.outputs.type }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: python3 {0}
        run: |
          import json, os, urllib.request, urllib.error

          try:
              with open("truncated-logs.txt") as f:
                  logs = f.read().strip()
          except FileNotFoundError:
              logs = ""

          if not logs:
              logs = "No log output was captured for this run."

          build_outcome = os.environ.get("BUILD_OUTCOME", "unknown")
          build_tool    = os.environ.get("BUILD_TOOL",    "unknown")
          actor         = os.environ.get("ACTOR",         "unknown")
          sha           = os.environ.get("SHA",           "unknown")[:8]
          event         = os.environ.get("EVENT_NAME",    "unknown")

          error_log_path = "logs/error.log"
          log_source = (
              "logs/error.log (dedicated error log)"
              if os.path.isfile(error_log_path) and os.path.getsize(error_log_path) > 0
              else "build.log (full build output)"
          )

          prompt = (
              "You are a senior Java/DevOps engineer reviewing a CI pipeline result.\n\n"
              "Context:\n"
              f"- Build tool    : {build_tool}\n"
              f"- Build outcome : {build_outcome}\n"
              f"- Triggered by  : {actor} via {event} (commit {sha})\n"
              f"- Log source    : {log_source}\n\n"
              "Build + test log output (may be truncated to last 8 KB):\n"
              "---\n"
              f"{logs}\n"
              "---\n\n"
              "Produce a concise Markdown CI report with exactly these sections:\n\n"
              "## \U0001f50d Build Summary\n"
              "(1-2 sentences: what happened overall)\n\n"
              "## ❌ Failures & Exceptions\n"
              "(Bullet list of each unique exception/error with root cause and failing class. Omit if no failures.)\n\n"
              "## \U0001f9ea Test Results\n"
              "(Pass/fail/skipped counts if in the logs. Write 'Not available' if absent.)\n\n"
              "## \U0001f6e0️ Recommended Fixes\n"
              "(One concrete actionable fix per failure. Omit if build passed.)\n\n"
              "## ✅ Status\n"
              "End with exactly one of:\n"
              "- \U0001f7e2 **BUILD PASSED** - all checks green\n"
              "- \U0001f534 **BUILD FAILED** - action required before merge\n"
              "- \U0001f7e1 **BUILD UNSTABLE** - compiled but test failures present\n\n"
              "Be direct and concise. No filler. Focus on what the developer must do right now."
          )

          payload = {
              "model": "gpt-4o-mini",
              "messages": [{"role": "user", "content": prompt}],
              "max_tokens": 900,
              "temperature": 0.2,
          }

          token = os.environ.get("GITHUB_TOKEN", "")
          req = urllib.request.Request(
              "https://models.inference.ai.azure.com/chat/completions",
              data=json.dumps(payload).encode(),
              headers={
                  "Authorization": "Bearer " + token,
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data    = json.loads(resp.read())
                  summary = data["choices"][0]["message"]["content"]
          except urllib.error.HTTPError as e:
              err     = e.read().decode()[:300]
              summary = f"⚠️ **AI summary unavailable** — HTTP {e.code}\n\n```\n{err}\n```"
          except Exception as e:
              summary = f"⚠️ **AI summary unavailable** — {type(e).__name__}: {e}"

          with open("ai_summary.md", "w") as f:
              f.write(summary)

          print("AI summary written to ai_summary.md")

      # ─── 9a. POST PR COMMENT ──────────────────────────────────────────────────
      - name: Post AI summary as PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: python3 {0}
        run: |
          import json, os, urllib.request, urllib.error

          try:
              with open("ai_summary.md") as f:
                  summary = f.read()
          except FileNotFoundError:
              summary = "⚠️ AI summary was not generated."

          pr_number = os.environ["PR_NUMBER"]
          head_ref  = os.environ["HEAD_REF"]
          base_ref  = os.environ["BASE_REF"]
          actor     = os.environ["ACTOR"]
          sha       = os.environ["HEAD_SHA"][:8]
          run_url   = os.environ["RUN_URL"]
          repo      = os.environ["GITHUB_REPOSITORY"]
          token     = os.environ["GITHUB_TOKEN"]

          body = (
              "## \U0001f916 Java CI — AI Build Report\n\n"
              f"> **Branch:** `{head_ref}` → `{base_ref}`"
              f" &nbsp;|&nbsp; **Author:** {actor}"
              f" &nbsp;|&nbsp; **Commit:** `{sha}`\n\n"
              "---\n\n"
              f"{summary}\n\n"
              "---\n"
              f"<sub>\U0001f4cb [View full workflow run]({run_url})"
              " &nbsp;|&nbsp; Powered by GitHub Models (gpt-4o-mini)</sub>"
          )

          payload = json.dumps({"body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments",
              data=payload,
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  result = json.loads(resp.read())
                  print("Comment posted:", result.get("html_url", "(no URL)"))
          except urllib.error.HTTPError as e:
              print(f"Failed to post comment - HTTP {e.code}:", e.read().decode()[:200])

      # ─── 9b. WORKFLOW RUN SUMMARY (push events) ───────────────────────────────
      - name: Write AI summary to workflow run summary
        if: always() && github.event_name == 'push'
        run: |
          echo "## 🤖 Java CI — AI Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat ai_summary.md >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No AI summary generated." >> $GITHUB_STEP_SUMMARY

      # ─── 10. PROPAGATE FAILURE ────────────────────────────────────────────────
      - name: Fail workflow if build failed
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::Build or tests failed. See the AI summary for details."
          exit 1
